<body>
<!--SHELL-->
<div id="wrap">
  <div id="stagebox">
    <div id="stage">
      <div id="slot"></div>
      <button class="tab l" id="tab-l" type="button" hidden></button>
      <button class="tab r" id="tab-r" type="button" hidden></button>
      <button class="tab u" id="tab-u" type="button" hidden></button>
      <button class="tab d" id="tab-d" type="button" hidden></button>
      <div class="hud" id="minimap" role="button" tabindex="0" aria-label="Open the map"></div>
      <div class="hud" id="dpad">
        <h4>NAVIGATE <small>OR KEYS</small></h4>
        <div class="pad">
          <button class="db" type="button" data-dir="u" aria-label="Up"></button>
          <button class="db" type="button" data-dir="l" aria-label="Left"></button>
          <button class="db mid" type="button" id="btn-map" aria-label="Open the map">MAP</button>
          <button class="db" type="button" data-dir="r" aria-label="Right"></button>
          <button class="db" type="button" data-dir="d" aria-label="Down"></button>
        </div>
        <div class="keys">Arrows · WASD · scroll<br>M for map · Esc to pause</div>
      </div>
      <div id="mnav"></div>
      <div id="mbar"><button type="button" id="m-map">MAP · <span id="m-count"></span></button><button type="button" id="m-title">MENU</button></div>
      <div id="overlay" role="dialog" aria-modal="true" aria-label="World map"></div>
      <div id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork"></div>
      <div id="toasts"></div>
    </div>
  </div>
</div>
<p class="sr" id="live" aria-live="polite"></p>
<script src="content.js"></script>
<script src="js/engine.js"></script>
<!--/SHELL-->
</body>
